body{margin:0;background:#0B0B0C}
*{box-sizing:border-box}
.s{width:390px;background:#0B0B0C;color:#F5F5F5;font-family:'Manrope',sans-serif;position:relative;overflow:hidden;padding:52px 20px 120px;display:flex;flex-direction:column;gap:18px}

.re{height:34px;padding:0 14px;border-radius:999px;background:#1C1C1F;border:1px solid #2A2A2E;color:#F5F5F5;font:800 12px 'Manrope'}
.nav{position:absolute;left:16px;right:16px;bottom:22px;height:72px;border-radius:28px;background:#141416;border:1px solid #2A2A2E;display:flex;align-items:center;justify-content:space-between;padding:0 18px}

.nav a.on{color:#E31E24}
.nav a.on::after{content:'';width:16px;height:3px;border-radius:2px;background:#E31E24}
.nav a.sc{width:52px;height:52px;min-width:52px;border-radius:26px;background:#E31E24;color:#fff;justify-content:center}
