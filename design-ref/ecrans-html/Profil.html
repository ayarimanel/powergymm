<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Profil</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>@font-face{font-family:'Manrope';font-style:normal;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:700;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:800;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:900;src:url(fonts/barlow-condensed-latin-900-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:500;src:url(fonts/barlow-condensed-latin-500-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:600;src:url(fonts/barlow-condensed-latin-600-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;src:url(fonts/barlow-condensed-latin-800-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:900;src:url(fonts/barlow-condensed-latin-900-italic.woff2) format('woff2')}
body{margin:0;background:#0B0B0C}
*{box-sizing:border-box}
.s{width:390px;background:#0B0B0C;color:#F5F5F5;font-family:'Manrope',sans-serif;position:relative;overflow:hidden;padding:52px 20px 40px;display:flex;flex-direction:column;gap:16px}
.n{font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:1}
.cp{font-size:12px;font-weight:600;color:#A1A1A6}
.sb{display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center}
a{color:#E31E24;text-decoration:none}
.st{flex:1;padding:16px 12px;border-radius:20px;background:#141416;border:1px solid #2A2A2E;display:flex;flex-direction:column;align-items:center;gap:4px}
.li{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #2A2A2E;color:#F5F5F5;background:none;border-left:0;border-right:0;border-top:0;width:100%;font:700 15px 'Manrope';text-align:left}
.li .i{width:40px;height:40px;border-radius:20px;background:#1C1C1F;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li .v{margin-left:auto;font:600 13px 'Manrope';color:#A1A1A6;display:flex;align-items:center;gap:6px}
</style>
<div class="s" style="height: 1120px">
  <div class="sb">
    <a href="Main.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1F; display: flex; align-items: center; justify-content: center; color: #F5F5F5"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 22px">Profil</span>
    <span style="width: 44px"></span>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="width: 112px; height: 112px; border-radius: 56px; border: 3px solid #E31E24; padding: 4px"><div style="width: 100%; height: 100%; border-radius: 50px; background: #1C1C1F; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 44px">M</div></div>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 36px; line-height: 1">MANEL&nbsp;</span>
    <span class="cp">Membre depuis mars 2025</span>
    <div class="row" style="gap: 10px; margin-top: 4px">
      <button aria-label="Instagram" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1F; border: 0; color: #F5F5F5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="20" x="2" y="2" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><path d="M17.5 6.5h.01"></path></svg></button>
      <button aria-label="Ajouter un réseau" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1F; border: 0; color: #F5F5F5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
    </div>
  </div>
  <div class="row" style="gap: 10px">
    <div class="st"><span class="n" style="font-size: 32px; color: #E31E24">24</span><span class="cp">Séances</span></div>
    <div class="st"><span class="n" style="font-size: 32px; color: #E31E24">3</span><span class="cp">Records</span></div>
    <div class="st"><span class="n" style="font-size: 32px; color: #E31E24">7</span><span class="cp">Badges</span></div>
  </div>
  <div class="row" style="gap: 12px; padding: 14px 16px; border-radius: 20px; background: #33240A; border: 1px solid rgba(245,165,36,.35)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font: 800 14px 'Manrope'">Abonnement mensuel</span><span class="cp" style="color: #F5A524">Expire aujourd'hui · passe à l'accueil</span></span>
  </div>
  <div>
    <button class="li"><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>Rappels<span class="v">Série, abonnement</span></button>
    <button class="li"><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg></span>Langue<span class="v">Français</span></button>
    <button class="li"><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"></circle><path d="m21 2-9.6 9.6"></path><path d="m15.5 7.5 3 3L22 7l-3-3"></path></svg></span>Changer mon code secret</button>
    <button class="li"><span class="i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>Modifier mon profil<span class="v">Photo, objectif</span></button>
  </div>
  <button style="height: 56px; border-radius: 999px; background: #1C1C1F; border: 1px solid #2A2A2E; color: #F5F5F5; font: 800 15px 'Manrope'; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Se déconnecter</button>
  <button style="background: none; border: 0; color: #ff4a4f; font: 700 13px 'Manrope'">Effacer toutes mes données</button>
</div>
