<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance en cours</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>@font-face{font-family:'Manrope';font-style:normal;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:700;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:800;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:900;src:url(fonts/barlow-condensed-latin-900-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:500;src:url(fonts/barlow-condensed-latin-500-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:600;src:url(fonts/barlow-condensed-latin-600-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;src:url(fonts/barlow-condensed-latin-800-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:900;src:url(fonts/barlow-condensed-latin-900-italic.woff2) format('woff2')}
body{margin:0;background:#0B0B0C}
*{box-sizing:border-box}
.s{width:390px;background:#0B0B0C;color:#F5F5F5;font-family:'Manrope',sans-serif;position:relative;overflow:hidden;padding:52px 20px 28px;display:flex;flex-direction:column;gap:18px}
.n{font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:1}
.cp{font-size:12px;font-weight:600;color:#A1A1A6}
.ov{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}
.sb{display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center}
.set{display:flex;align-items:center;height:64px;padding:0 10px 0 18px;border-radius:20px;background:#141416;border:1px solid #2A2A2E}
.set .c1{width:52px}.set .c2,.set .c3{width:100px;display:flex;align-items:baseline;gap:4px}
.ok{margin-left:auto;width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;color:#fff}
.t{flex:1;height:40px;border-radius:999px;border:0;background:#1C1C1F;color:#A1A1A6;font:700 13px 'Manrope'}
</style>
<div class="s" style="height: 844px">
  <div class="sb">
    <button aria-label="Quitter la séance" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1F; border: 0; color: #F5F5F5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    <span class="row" style="gap: 6px; color: #A1A1A6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg><span class="n" style="font-size: 26px; color: #F5F5F5">24:18</span></span>
    <button style="height: 40px; padding: 0 16px; border-radius: 999px; background: #E31E24; color: #fff; border: 0; font: 800 13px 'Manrope'">Terminer</button>
  </div>
  <div class="row" style="gap: 4px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #E31E24"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #E31E24"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #26262A"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #26262A"></span></div>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <span class="ov" style="color: #E31E24">Exercice 2 / 4 · Jambes</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 52px; line-height: .95">Squat barre</h1>
    <span class="row cp" style="gap: 6px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>Ton record : 75 kg × 6</span>
  </div>
  <div class="row ov" style="color: #6B6B70; padding: 0 18px"><span style="width: 52px">Série</span><span style="width: 100px">Reps</span><span style="width: 100px">Poids</span></div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div class="set"><span class="n c1" style="font-size: 26px">1</span><span class="c2"><span class="n" style="font-size: 26px">10</span><span class="cp">reps</span></span><span class="c3"><span class="n" style="font-size: 26px">60</span><span class="cp">kg</span></span><button class="ok" aria-label="Série validée" style="background: #22C55E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button></div>
    <div class="set"><span class="n c1" style="font-size: 26px">2</span><span class="c2"><span class="n" style="font-size: 26px">8</span><span class="cp">reps</span></span><span class="c3"><span class="n" style="font-size: 26px">70</span><span class="cp">kg</span></span><button class="ok" aria-label="Série validée" style="background: #22C55E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button></div>
    <div class="set" style="background: #F5F5F5; color: #0B0B0C; border-color: #F5F5F5"><span class="n c1" style="font-size: 26px">3</span><span class="c2"><span class="n" style="font-size: 26px">6</span><span class="cp" style="color: #6B6B70">reps</span></span><span class="c3"><span class="n" style="font-size: 26px">80</span><span class="cp" style="color: #6B6B70">kg</span></span><button class="ok" aria-label="Valider la série" style="background: #E31E24; box-shadow: 0 6px 18px rgba(227,30,36,.4)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button></div>
  </div>
  <button class="row" style="justify-content: center; gap: 8px; height: 52px; border-radius: 18px; border: 1.5px dashed #3A3A3F; background: transparent; color: #A1A1A6; font: 700 13px 'Manrope'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Ajouter une série</button>
  <div style="background: #141416; border: 1px solid #2A2A2E; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div class="sb"><span class="row" style="gap: 8px; font: 800 15px 'Manrope'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E31E24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4"></path><path d="m12 14 3-3"></path><circle cx="12" cy="14" r="8"></circle></svg>Repos</span><span class="n" style="font-size: 40px">1:12</span></div>
    <div style="height: 6px; border-radius: 3px; background: #26262A"><div style="width: 62%; height: 6px; border-radius: 3px; background: #E31E24"></div></div>
    <div class="row" style="gap: 8px"><button class="t">60 s</button><button class="t" style="background: #3A1214; color: #ff6a6e">90 s</button><button class="t">120 s</button></div>
  </div>
  <div class="row cp" style="justify-content: center; gap: 8px; margin-top: auto; font-size: 13px">Suivant : Presse à cuisses<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></div>
</div>
</body>
</html>
