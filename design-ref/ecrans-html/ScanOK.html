<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Check-in réussi</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>@font-face{font-family:'Manrope';font-style:normal;font-weight:500;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:600;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:700;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:800;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:900;src:url(fonts/barlow-condensed-latin-900-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:500;src:url(fonts/barlow-condensed-latin-500-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:600;src:url(fonts/barlow-condensed-latin-600-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:700;src:url(fonts/barlow-condensed-latin-700-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:800;src:url(fonts/barlow-condensed-latin-800-italic.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:italic;font-weight:900;src:url(fonts/barlow-condensed-latin-900-italic.woff2) format('woff2')}
body{margin:0;background:#0B0B0C}
*{box-sizing:border-box}
.s{width:390px;background:#0B0B0C;color:#F5F5F5;font-family:'Manrope',sans-serif;position:relative;overflow:hidden;padding:52px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:16px}
.n{font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:1}
.cp{font-size:12px;font-weight:600;color:#A1A1A6}
.row{display:flex;align-items:center}
a{text-decoration:none}
.tile{flex:1;padding:16px;border-radius:20px;background:#141416;border:1px solid #2A2A2E;display:flex;flex-direction:column;gap:4px}
</style>
<div class="s" style="height: 844px">
  <div style="margin-top: 90px; width: 150px; height: 150px; border-radius: 75px; background: rgba(34,197,94,.12); display: flex; align-items: center; justify-content: center">
    <div style="width: 104px; height: 104px; border-radius: 52px; background: #22C55E; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(34,197,94,.35)"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></div>
  </div>
  <h1 style="margin: 18px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 48px; line-height: .95; text-align: center">Bienvenue<br><span style="color: #E31E24">Manel</span></h1>
  <p style="margin: 0; font: 500 15px 'Manrope'; color: #A1A1A6">Check-in enregistré à 18:30</p>
  <div class="row" style="gap: 12px; width: 100%; margin-top: 16px">
    <div class="tile"><span class="row" style="gap: 6px; color: #F5A524"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg><span class="n" style="font-size: 30px; color: #F5F5F5">4</span></span><span class="cp">jours d'affilée · +1</span></div>
    <div class="tile"><span class="row" style="gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F5A524"></span><span class="n" style="font-size: 30px">36</span></span><span class="cp">au plateau · moyen</span></div>
  </div>
  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 12px">
    <a href="Seance.html" style="height: 56px; border-radius: 999px; background: #E31E24; color: #fff; font: 800 15px 'Manrope'; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 24px rgba(227,30,36,.35)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3 20 12 6 21Z"></path></svg>Commencer ma séance</a>
    <a href="Main.html" style="height: 56px; border-radius: 999px; border: 1.5px solid #2A2A2E; color: #F5F5F5; font: 800 15px 'Manrope'; display: flex; align-items: center; justify-content: center">Retour à l'accueil</a>
  </div>
</div>
</body>
</html>
