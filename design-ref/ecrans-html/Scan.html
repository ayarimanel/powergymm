<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scan à l'entrée</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">

body{margin:0;background:#0B0B0C}
*{box-sizing:border-box}
.s{width:390px;background:#111113;color:#F5F5F5;font-family:'Manrope',sans-serif;position:relative;overflow:hidden;padding:52px 24px 120px;display:flex;flex-direction:column;align-items:center;gap:20px}
.cp{font-size:12px;font-weight:600;color:#A1A1A6}
.row{display:flex;align-items:center}
a{color:#E31E24;text-decoration:none}
.cn{position:absolute;width:44px;height:44px;border-color:#E31E24;border-style:solid;border-width:0}
.nav{position:absolute;left:16px;right:16px;bottom:22px;height:72px;border-radius:28px;background:#141416;border:1px solid #2A2A2E;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B6B70;font:700 11px 'Manrope';min-width:48px}
.nav a.sc{width:52px;height:52px;min-width:52px;border-radius:26px;background:#E31E24;color:#fff;justify-content:center;box-shadow:0 0 0 5px rgba(227,30,36,.25)}
</style>
<div class="s" style="height: 844px">
  <div class="row" style="width: 100%; justify-content: space-between">
    <a href="Main.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1F; display: flex; align-items: center; justify-content: center; color: #F5F5F5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    <span style="font: 800 11px 'Manrope'; letter-spacing: 1.6px; color: #E31E24">CHECK-IN</span>
    <button aria-label="Allumer la lampe" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1F; border: 0; color: #F5F5F5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg></button>
  </div>
  <h1 style="margin: 40px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 40px; line-height: .95; text-align: center">Scanne le QR<br>à l'entrée</h1>
  <div style="position: relative; width: 250px; height: 250px; margin-top: 18px; display: flex; align-items: center; justify-content: center">
    <span class="cn" style="top: 0; left: 0; border-top-width: 6px; border-left-width: 6px; border-top-left-radius: 22px"></span>
    <span class="cn" style="top: 0; right: 0; border-top-width: 6px; border-right-width: 6px; border-top-right-radius: 22px"></span>
    <span class="cn" style="bottom: 0; left: 0; border-bottom-width: 6px; border-left-width: 6px; border-bottom-left-radius: 22px"></span>
    <span class="cn" style="bottom: 0; right: 0; border-bottom-width: 6px; border-right-width: 6px; border-bottom-right-radius: 22px"></span>
    <svg width="170" height="170" viewBox="0 0 24 24" fill="none" stroke="#F5F5F5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: .9"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3"></path><path d="M21 21v.01"></path><path d="M12 7v3a2 2 0 0 1-2 2H7"></path><path d="M3 12h.01"></path><path d="M12 3h.01"></path><path d="M12 16v.01"></path><path d="M16 12h1"></path><path d="M21 12v.01"></path><path d="M12 21v-1"></path></svg>
    <span style="position: absolute; left: 18px; right: 18px; top: 112px; height: 4px; border-radius: 2px; background: #E31E24; box-shadow: 0 0 18px 4px rgba(227,30,36,.55)"></span>
  </div>
  <p style="margin: 18px 0 0; font: 500 15px/1.5 'Manrope'; color: #A1A1A6; text-align: center; max-width: 280px">Vise le code affiché à l'accueil. Ton passage est enregistré automatiquement.</p>
  <div class="row" style="gap: 12px; width: 100%; padding: 14px 16px; border-radius: 20px; background: #1C1C1F; border: 1px solid #2A2A2E; margin-top: auto">
    <span style="width: 40px; height: 40px; border-radius: 20px; background: #33240A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font: 800 14px 'Manrope'">Abonnement mensuel</span><span class="cp" style="color: #F5A524">Expire aujourd'hui · passe à l'accueil</span></span>
  </div>
  <nav class="nav" aria-label="Navigation principale">
    <a href="Main.html" aria-label="Accueil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></a>
    <a href="Entrainement.html" aria-label="Entraînement"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg></a>
    <a href="ScanOK.html" class="sc" aria-label="Scanner (actif) · voir le succès"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3"></path><path d="M12 7v3a2 2 0 0 1-2 2H7"></path><path d="M16 12h1"></path><path d="M12 21v-1"></path></svg></a>
    <a href="Boutique.html" aria-label="Boutique"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></a>
    <a href="Communaute.html" aria-label="Communauté"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></a>
  </nav>
</div>
</body>
</html>
